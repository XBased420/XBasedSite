name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      launch-ready: ${{ steps.launch.outputs.ready }}
    steps:
      - uses: actions/checkout@v4
      - id: launch
        name: Read launch state
        run: node --input-type=module -e "import fs from 'node:fs'; import settings from './site.config.mjs'; fs.appendFileSync(process.env.GITHUB_OUTPUT, 'ready=' + settings.launchReady + '\n');"
      - name: Test source
        run: node --test scripts/backend.test.mjs scripts/render.test.mjs
      - name: Verify production configuration
        if: steps.launch.outputs.ready == 'true'
        run: node scripts/check-launch.mjs --strict
      - uses: withastro/action@v3
        with:
          node-version: 22

  deploy:
    needs: build
    if: needs.build.outputs.launch-ready == 'true'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
